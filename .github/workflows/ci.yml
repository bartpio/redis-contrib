name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore StackExchangeRedisCache.Contrib.slnx

      - name: Build
        run: dotnet build StackExchangeRedisCache.Contrib.slnx -c Release --no-restore

      - name: Test
        run: dotnet test StackExchangeRedisCache.Contrib.Tests/StackExchangeRedisCache.Contrib.Tests.csproj -c Release --no-build --verbosity normal
